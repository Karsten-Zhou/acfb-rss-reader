# https://github.com/evilmartians/lefthook
# pre-commit intentionally runs only lint-staged: it formats and fixes the
# staged files fast. The full typecheck/lint/test gate runs once in
# pre-push. (Running `bun run typecheck` in pre-commit both duplicated that
# gate and intermittently dead-piped on Windows, blocking every commit.)
pre-commit:
  commands:
    lint-staged:
      # Every file extension Biome handles (incl. jsonc: wrangler.jsonc,
      # tsconfig.*.json). Anything missing here slips through to pre-push lint.
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,vue,json,jsonc,css,html,md}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    lint:
      run: bun run lint
    test:
      run: bun run test
