# https://github.com/evilmartians/lefthook
pre-commit:
  parallel: true
  commands:
    lint-staged:
      glob: "*.{ts,tsx,vue,js,jsx,json,md,css,html}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: bun run typecheck

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    lint:
      run: bun run lint
    test:
      run: bun run test
